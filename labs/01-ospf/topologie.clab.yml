# Labo 01 : deux routeurs FRR reliés en OSPF, un PC derrière chacun
# Labo isolé : lien direct r1-r2 (10.0.12.0/30) et OSPF entre sites, hors plan final.
name: ospf-lab

topology:
  nodes:
    r1:
      kind: linux
      image: frrouting/frr:latest  # TODO : figer une version précise (voir docs/journal.md)
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.255.0.1/32 dev lo
        - ip addr add 10.0.12.1/30 dev eth1
        - ip addr add 10.1.10.1/24 dev eth2
    r2:
      kind: linux
      image: frrouting/frr:latest  # TODO : figer une version précise (voir docs/journal.md)
      binds:
        - configs/r2/daemons:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.255.0.2/32 dev lo
        - ip addr add 10.0.12.2/30 dev eth1
        - ip addr add 10.2.10.1/24 dev eth2
    pc1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 10.1.10.100/24 dev eth1
        - ip route replace default via 10.1.10.1
    pc2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 10.2.10.100/24 dev eth1
        - ip route replace default via 10.2.10.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["pc1:eth1", "r1:eth2"]
    - endpoints: ["pc2:eth1", "r2:eth2"]
