frr defaults traditional
hostname risp
log stdout
service integrated-vtysh-config
!
! L'ISP relaie les routes reçues de R1 et R2 sans filtrage
route-map TOUT-PERMIS permit 10
!
router bgp 65000
 bgp router-id 10.255.0.3
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.1.1 description R1
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.2.2 description R2
 !
 address-family ipv4 unicast
  neighbor 10.0.1.1 route-map TOUT-PERMIS in
  neighbor 10.0.1.1 route-map TOUT-PERMIS out
  neighbor 10.0.2.2 route-map TOUT-PERMIS in
  neighbor 10.0.2.2 route-map TOUT-PERMIS out
 exit-address-family
!
