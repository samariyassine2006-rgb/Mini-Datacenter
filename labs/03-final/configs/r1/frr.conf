frr defaults traditional
hostname r1
log stdout
service integrated-vtysh-config
!
! R1 n'annonce à l'ISP que son lien (extrémité du tunnel WireGuard)
ip prefix-list ANNONCE-R1 seq 10 permit 10.0.1.0/30
!
route-map VERS-ISP permit 10
 match ip address prefix-list ANNONCE-R1
!
route-map DEPUIS-ISP permit 10
!
router bgp 65001
 bgp router-id 10.255.0.1
 neighbor 10.0.1.2 remote-as 65000
 neighbor 10.0.1.2 description R-ISP
 !
 address-family ipv4 unicast
  network 10.0.1.0/30
  neighbor 10.0.1.2 route-map DEPUIS-ISP in
  neighbor 10.0.1.2 route-map VERS-ISP out
 exit-address-family
!
