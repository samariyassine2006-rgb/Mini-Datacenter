# DHCP du site A (VLAN clients). Le DNS est assuré par le serveur dns.
port=0
interface=eth2
bind-interfaces
dhcp-authoritative
dhcp-range=10.1.10.100,10.1.10.199,255.255.255.0,12h
dhcp-option=option:router,10.1.10.1
dhcp-option=option:dns-server,10.1.20.10
dhcp-option=option:domain-search,projet.local
dhcp-leasefile=/tmp/dnsmasq.leases
log-dhcp
