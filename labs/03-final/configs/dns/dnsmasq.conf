# Serveur DNS de la zone projet.local (site A, 10.1.20.10)
port=53
interface=eth1
bind-interfaces
no-resolv
no-hosts
domain=projet.local
local=/projet.local/
host-record=dns.projet.local,10.1.20.10
host-record=web.projet.local,10.2.20.10
host-record=r1.projet.local,10.1.10.1
host-record=r2.projet.local,10.2.10.1
log-queries
