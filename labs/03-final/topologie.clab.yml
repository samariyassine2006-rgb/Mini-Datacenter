# Labo 03 : topologie finale (eBGP + WireGuard + DHCP + DNS + web + pare-feu/NAT)
# Adressage conforme à docs/plan-adressage.md
# Images à construire d'abord (fait par scripts/deploy-final.sh) :
#   docker build -t frr-wg:latest labs/03-final
#   docker build -t lab-tools:latest -f labs/03-final/Dockerfile.tools labs/03-final
name: final

topology:
  nodes:
    r1:
      kind: linux
      image: frr-wg:latest
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/r1/dnsmasq.conf:/etc/dnsmasq.conf
        - configs/r1/firewall.nft:/etc/firewall.nft
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.255.0.1/32 dev lo
        - ip addr add 10.0.1.1/30 dev eth1
        - ip addr add 10.1.10.1/24 dev eth2
        - ip addr add 10.1.20.1/24 dev eth3
        - nft -f /etc/firewall.nft
        - dnsmasq -C /etc/dnsmasq.conf
    risp:
      kind: linux
      image: frr-wg:latest
      binds:
        - configs/risp/daemons:/etc/frr/daemons
        - configs/risp/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.255.0.3/32 dev lo
        - ip addr add 10.0.1.2/30 dev eth1
        - ip addr add 10.0.2.1/30 dev eth2
    r2:
      kind: linux
      image: frr-wg:latest
      binds:
        - configs/r2/daemons:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - configs/r2/dnsmasq.conf:/etc/dnsmasq.conf
        - configs/r2/firewall.nft:/etc/firewall.nft
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.255.0.2/32 dev lo
        - ip addr add 10.0.2.2/30 dev eth1
        - ip addr add 10.2.10.1/24 dev eth2
        - ip addr add 10.2.20.1/24 dev eth3
        - nft -f /etc/firewall.nft
        - dnsmasq -C /etc/dnsmasq.conf
    pc1:
      kind: linux
      image: lab-tools:latest
      cmd: sleep infinity
      binds:
        - configs/client/udhcpc-dns.script:/etc/udhcpc-dns.script
      exec:
        - ip route del default
        - cp /etc/udhcpc-dns.script /usr/local/bin/udhcpc-dns
        - chmod +x /usr/local/bin/udhcpc-dns
        - udhcpc -i eth1 -b -s /usr/local/bin/udhcpc-dns
    pc2:
      kind: linux
      image: lab-tools:latest
      cmd: sleep infinity
      binds:
        - configs/client/udhcpc-dns.script:/etc/udhcpc-dns.script
      exec:
        - ip route del default
        - cp /etc/udhcpc-dns.script /usr/local/bin/udhcpc-dns
        - chmod +x /usr/local/bin/udhcpc-dns
        - udhcpc -i eth1 -b -s /usr/local/bin/udhcpc-dns
    dns:
      kind: linux
      image: lab-tools:latest
      cmd: sleep infinity
      binds:
        - configs/dns/dnsmasq.conf:/etc/dnsmasq.conf
      exec:
        - ip addr add 10.1.20.10/24 dev eth1
        - ip route replace default via 10.1.20.1
        - dnsmasq -C /etc/dnsmasq.conf
    web:
      kind: linux
      image: nginx:alpine
      exec:
        - ip addr add 10.2.20.10/24 dev eth1
        - ip route replace default via 10.2.20.1

  links:
    - endpoints: ["r1:eth1", "risp:eth1"]
    - endpoints: ["risp:eth2", "r2:eth1"]
    - endpoints: ["pc1:eth1", "r1:eth2"]
    - endpoints: ["dns:eth1", "r1:eth3"]
    - endpoints: ["pc2:eth1", "r2:eth2"]
    - endpoints: ["web:eth1", "r2:eth3"]
